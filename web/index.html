<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Venn·bar — quiet conference networking</title>
    <meta
      name="description"
      content="A map of the conferences worth showing up to — and the people you'll see there. Mark events as going or been, find your overlap, and ping the people you actually want to meet."
    />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack, Discord, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Venn·bar" />
    <meta property="og:url" content="https://venn.bar/" />
    <meta property="og:title" content="Venn·bar — quiet conference networking" />
    <meta
      property="og:description"
      content="A map of the conferences worth showing up to — and the people you'll see there."
    />
    <!-- Single wide hero (1.91:1) — works across Twitter, Facebook,
         LinkedIn, iMessage, Slack, Discord, WhatsApp. We tried chaining
         a square variant as a second og:image; iMessage rendered both
         side-by-side rather than picking one, which is the wrong shape.
         If we ever want a per-platform square card, the right path is a
         dedicated route + UA sniffing, not a second og:image. -->
    <meta property="og:image" content="https://venn.bar/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Venn·bar wordmark on warm paper, with the tagline ‘a map of the conferences worth showing up to — and the people you'll see there.’"
    />

    <!-- Twitter / X — summary_large_image is the wide hero treatment -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Venn·bar — quiet conference networking" />
    <meta
      name="twitter:description"
      content="A map of the conferences worth showing up to — and the people you'll see there."
    />
    <meta name="twitter:image" content="https://venn.bar/og.png" />
    <meta
      name="twitter:image:alt"
      content="Venn·bar wordmark on warm paper, with the tagline ‘a map of the conferences worth showing up to — and the people you'll see there.’"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
