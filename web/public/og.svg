<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf9f4"/>
      <stop offset="100%" stop-color="#f4f1ea"/>
    </linearGradient>
    <radialGradient id="accent-tl" cx="0.18" cy="0.22" r="0.6">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent-br" cx="0.85" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#b794f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b794f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#accent-tl)"/>
  <rect width="1200" height="630" fill="url(#accent-br)"/>

  <!-- Hairline editorial frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#e2dccf" stroke-width="2"/>

  <!-- Top kicker -->
  <text x="600" y="138"
        font-family="'JetBrains Mono', Menlo, ui-monospace, monospace"
        font-size="14" text-anchor="middle" fill="#5a554c"
        letter-spacing="3.08" font-weight="600">QUIET CONFERENCE NETWORKING</text>

  <!-- Venn brand mark — two overlapping circles. Sized + positioned so
       its center aligns with the wordmark's center axis. -->
  <g transform="translate(548, 200)">
    <circle cx="36" cy="40" r="36" fill="none" stroke="#1a1814" stroke-width="3"/>
    <circle cx="68" cy="40" r="36" fill="none" stroke="#c2410c" stroke-width="3"/>
  </g>

  <!-- Wordmark — Venn·bar, the · in terracotta. -->
  <text x="600" y="380"
        font-family="Fraunces, Iowan Old Style, Georgia, 'Times New Roman', serif"
        font-size="128" font-weight="500" text-anchor="middle"
        fill="#1a1814" letter-spacing="-3.84">
    <tspan>Venn</tspan><tspan fill="#c2410c">·</tspan><tspan>bar</tspan>
  </text>

  <!-- Tagline — italic serif, two lines for breathing room -->
  <text x="600" y="448"
        font-family="Fraunces, Iowan Old Style, Georgia, 'Times New Roman', serif"
        font-size="28" font-style="italic" text-anchor="middle" fill="#5a554c">
    A map of the conferences worth showing up to
  </text>
  <text x="600" y="488"
        font-family="Fraunces, Iowan Old Style, Georgia, 'Times New Roman', serif"
        font-size="28" font-style="italic" text-anchor="middle" fill="#5a554c">
    — and the people you'll see there.
  </text>

  <!-- Footer URL -->
  <text x="600" y="558"
        font-family="'JetBrains Mono', Menlo, ui-monospace, monospace"
        font-size="13" text-anchor="middle" fill="#1a1814"
        letter-spacing="2.86" font-weight="600">VENN.BAR</text>
</svg>
