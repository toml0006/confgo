name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      # Check out with the release PAT so the post-deploy push back to main
      # bypasses branch protection. fetch-depth: 0 gives `git pull --rebase`
      # full history to work with.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix web

      - name: Build web
        working-directory: web
        env:
          VITE_USE_FIREBASE_EMULATORS: "false"
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools deploy \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --non-interactive \
            --force \
            --only hosting,functions,firestore,storage

      # The build step above runs `npm run build`, which fires `prebuild`
      # → bump-version.mjs, mutating web/package.json. Persist that change
      # back to main so the version monotonically advances across deploys.
      # Authenticated via RELEASE_PAT (set on the checkout step), which
      # must have Contents: Write on this repo and bypass branch protection.
      # `[skip ci]` keeps this from re-triggering the workflow.
      - name: Commit version bump back to main
        if: success()
        run: |
          if git diff --quiet web/package.json; then
            echo "No version change to commit"
            exit 0
          fi
          git config user.name "confgo-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          VERSION=$(node -p "require('./web/package.json').version")
          BUILD=$(node -p "require('./web/package.json').buildNumber")
          git add web/package.json
          git commit -m "chore: bump web to v${VERSION} (${BUILD}) [skip ci]"
          # Rebase in case main moved while we deployed (concurrency group
          # serializes deploys, but humans can merge between runs).
          git pull --rebase origin main
          git push origin HEAD:main
