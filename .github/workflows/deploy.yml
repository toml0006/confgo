name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix web

      - name: Build web
        working-directory: web
        env:
          VITE_USE_FIREBASE_EMULATORS: "false"
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Diagnose SA permissions
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set +e
          echo "--- SA identity ---"
          python3 -c "import json,os; d=json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS'])); print('client_email:', d.get('client_email')); print('project_id:', d.get('project_id'))"
          TOKEN=$(gcloud auth print-access-token)
          echo "--- token info (scopes) ---"
          curl -s "https://oauth2.googleapis.com/tokeninfo?access_token=$TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('scope:', d.get('scope')); print('email:', d.get('email')); print('aud:', d.get('aud'))"
          echo "--- 1. resourcemanager.projects.get ---"
          curl -s -o /tmp/a.json -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://cloudresourcemanager.googleapis.com/v1/projects/$PROJECT_ID"
          head -c 400 /tmp/a.json; echo
          echo "--- 2. serviceusage.services.get (firebasehosting) ---"
          curl -s -o /tmp/b.json -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://serviceusage.googleapis.com/v1/projects/$PROJECT_ID/services/firebasehosting.googleapis.com"
          head -c 400 /tmp/b.json; echo
          echo "--- 3. firestore databases.list ---"
          curl -s -o /tmp/c.json -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases"
          head -c 400 /tmp/c.json; echo
          echo "--- 4. IAM policy: list bindings for this SA ---"
          SA_EMAIL=$(python3 -c "import json,os; print(json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']))['client_email'])")
          curl -s -o /tmp/d.json -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -X POST -d "{}" "https://cloudresourcemanager.googleapis.com/v1/projects/$PROJECT_ID:getIamPolicy"
          python3 -c "import json; d=json.load(open('/tmp/d.json')); bindings=d.get('bindings',[]); me='$SA_EMAIL'; print('total bindings:',len(bindings)); [print(' ',b['role']) for b in bindings if f'serviceAccount:{me}' in b.get('members',[])]" 2>/dev/null || head -c 400 /tmp/d.json
          set -e

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools@13 deploy \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force \
            --only hosting,functions,firestore,storage
