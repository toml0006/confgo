name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix web

      - name: Build web
        working-directory: web
        env:
          VITE_USE_FIREBASE_EMULATORS: "false"
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Diagnose — compare SA token vs Firebase CI token
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set +e
          echo "=== SA TOKEN (firebase-adminsdk-fbsvc@confgo-dev) ==="
          SA_TOKEN=$(gcloud auth print-access-token)
          echo "--- scopes ---"
          curl -s "https://oauth2.googleapis.com/tokeninfo?access_token=$SA_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('email:', d.get('email')); print('scope:', d.get('scope'))"
          for ep in "cloudresourcemanager.googleapis.com/v1/projects/$PROJECT_ID" "serviceusage.googleapis.com/v1/projects/$PROJECT_ID/services/firebasehosting.googleapis.com"; do
            echo "--- GET $ep ---"
            curl -s -o /tmp/sa.json -w "HTTP %{http_code}\n" -H "Authorization: Bearer $SA_TOKEN" "https://$ep"
          done

          echo ""
          echo "=== USER TOKEN (via Firebase CI refresh token → jackson@middleout.dev) ==="
          # Firebase CLI official OAuth client (public; same creds firebase-tools uses)
          USER_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=563584335869-fgrhgmd47bqnekij5i8b5pr03ho849e6.apps.googleusercontent.com" \
            -d "client_secret=j9iVZfS8kkCEFUPaAeJX0Lp8" \
            -d "refresh_token=$FIREBASE_TOKEN" \
            -d "grant_type=refresh_token" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$USER_TOKEN" ]; then
            echo "FAILED to exchange refresh token"
          else
            echo "--- scopes ---"
            curl -s "https://oauth2.googleapis.com/tokeninfo?access_token=$USER_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('email:', d.get('email')); print('scope:', d.get('scope'))"
            for ep in "cloudresourcemanager.googleapis.com/v1/projects/$PROJECT_ID" "serviceusage.googleapis.com/v1/projects/$PROJECT_ID/services/firebasehosting.googleapis.com"; do
              echo "--- GET $ep ---"
              curl -s -o /tmp/u.json -w "HTTP %{http_code}\n" -H "Authorization: Bearer $USER_TOKEN" "https://$ep"
            done
            echo "--- USER: list IAM bindings for SA ---"
            curl -s -o /tmp/iam.json -w "HTTP %{http_code}\n" -H "Authorization: Bearer $USER_TOKEN" -H "Content-Type: application/json" -X POST -d "{}" "https://cloudresourcemanager.googleapis.com/v1/projects/$PROJECT_ID:getIamPolicy"
            python3 <<PY
          import json
          try:
              d=json.load(open('/tmp/iam.json'))
              sa='firebase-adminsdk-fbsvc@confgo-dev.iam.gserviceaccount.com'
              bindings=d.get('bindings',[])
              print('total bindings:', len(bindings))
              for b in bindings:
                  if f'serviceAccount:{sa}' in b.get('members',[]):
                      print('  SA binding:', b['role'])
          except Exception as e:
              print('parse error:', e)
              print(open('/tmp/iam.json').read()[:600])
          PY
          fi
          set -e

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools@13 deploy \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force \
            --only hosting,functions,firestore,storage
