name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix web

      - name: Build web
        working-directory: web
        env:
          VITE_USE_FIREBASE_EMULATORS: "false"
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Diagnose — full error body via user token
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set +e
          echo "=== firebase-tools@13 with --token: projects:list ==="
          npx -y firebase-tools@13 projects:list --token "$FIREBASE_TOKEN" 2>&1 | tail -20
          echo ""
          echo "=== firebase-tools@13 with --token: apps:list (project-scoped) ==="
          npx -y firebase-tools@13 apps:list --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" 2>&1 | tail -20
          echo ""
          echo "=== SA access token — full serviceusage error body ==="
          SA_TOKEN=$(gcloud auth print-access-token)
          curl -sS -H "Authorization: Bearer $SA_TOKEN" "https://serviceusage.googleapis.com/v1/projects/$PROJECT_ID/services/firebasehosting.googleapis.com"
          echo ""
          echo "=== SA access token — cloudresourcemanager error body ==="
          curl -sS -H "Authorization: Bearer $SA_TOKEN" "https://cloudresourcemanager.googleapis.com/v1/projects/$PROJECT_ID"
          echo ""
          set -e

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools@13 deploy \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force \
            --only hosting,functions,firestore,storage
