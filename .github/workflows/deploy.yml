name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix web

      - name: Build web
        working-directory: web
        env:
          VITE_USE_FIREBASE_EMULATORS: "false"
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Diagnose credentials
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "--- service account identity ---"
          python3 -c "import json,os; d=json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS'])); print('client_email:', d.get('client_email')); print('project_id:', d.get('project_id'))"
          echo "--- access token serviceusage GET (should be 200) ---"
          TOKEN=$(gcloud auth print-access-token 2>/dev/null || curl -s -H "Metadata-Flavor: Google" http://metadata/computeMetadata/v1/instance/service-accounts/default/token | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          if [ -n "$TOKEN" ]; then
            curl -s -o /tmp/su.json -w "HTTP %{http_code}\n" \
              -H "Authorization: Bearer $TOKEN" \
              "https://serviceusage.googleapis.com/v1/projects/$GOOGLE_CLOUD_PROJECT/services/firebasestorage.googleapis.com"
            head -c 600 /tmp/su.json; echo
          else
            echo "no token obtained"
          fi

      - name: Deploy to Firebase
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools@13 deploy \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force \
            --only hosting,functions,firestore,storage
