name: Diag secret
on:
  push:
    branches: [deploy-diag]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - env:
          PID_FROM_SECRET: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "length: ${#PID_FROM_SECRET}"
          echo "sha256:"
          printf '%s' "$PID_FROM_SECRET" | sha256sum
          echo "expected sha256 for confgo-dev:"
          printf '%s' 'confgo-dev' | sha256sum
