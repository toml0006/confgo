name: Diag secret
on:
  push:
    branches: [deploy-diag]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          APIK: ${{ secrets.FIREBASE_API_KEY }}
          AD: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          SB: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          APP: ${{ secrets.FIREBASE_APP_ID }}
          MBX: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FT: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          for n in PID APIK AD SB APP MBX SA FT; do
            v=$(eval "echo \$$n")
            echo "$n length=${#v}"
          done
